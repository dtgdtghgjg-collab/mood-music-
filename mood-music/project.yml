name: MoodMusic
options:
  bundleIdPrefix: com.hayasa
  deploymentTarget:
    iOS: "17.0"
targets:
  MoodMusic:
    type: application
    platform: iOS
    sources: [MoodMusic]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Mood Music
        UILaunchScreen: {}
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: Нужна, чтобы показывать вас на карте и задавать зоны.
        NSLocationAlwaysAndWhenInUseUsageDescription: Нужна, чтобы включать музыку при входе в зону, даже когда приложение закрыто.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hayasa.moodmusic
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
